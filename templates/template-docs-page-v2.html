<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}} — RAPID</title>
<!-- ============================================================
     STANDARD DOCS WEB-PAGE TEMPLATE — v2 ("Constellation" dark theme)
     A re-skin of template-docs-page.html: SAME class contract + DOM +
     {{NAV}}/{{SIDEBAR}}/{{MAIN}} placeholders + the two sibling scripts,
     so sidebar.js / env-links.js and every generated page keep working.
     Only the <style> tokens + component rules change (dark, cosmic).
     atlas-init.sh extracts THIS <style> block when ATLAS_TEMPLATE points here.
     Design spec: docs/atlas-v2-design.md. ============================ -->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0D1117; --surface: #161B22; --surface-alt: #1C2330;
  --border: #2A313B; --border-light: #20262F;
  --text: #E6EDF3; --text-muted: #9BA6B2; --text-dim: #6B7480;
  /* --navy is repurposed as the primary ACCENT (fills / active / eyebrow) */
  --navy: #7AA2F7; --accent: #7AA2F7; --accent-dim: rgba(122,162,247,0.12);
  --blue: #58A6FF; --blue-dim: rgba(88,166,255,0.14);
  --green: #3FB950; --green-dim: rgba(63,185,80,0.14);
  --red: #F85149; --red-dim: rgba(248,81,73,0.14);
  --amber: #D29922; --amber-dim: rgba(210,153,34,0.14);
  --purple: #BC8CFF; --purple-dim: rgba(188,140,255,0.14);
  --teal: #56D4DD; --teal-dim: rgba(86,212,221,0.14);
  --radius: 8px; --radius-sm: 6px;
  --code-bg: #0A0D12;
}
html { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
/* faint cosmic depth: a soft accent glow + a barely-there starfield */
body::before { content:""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(122,162,247,0.07), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(86,212,221,0.04), transparent 55%); }
body > * { position: relative; z-index: 1; }
.spec-layout { display: flex; flex: 1; }

/* Sidebar nav (left menu) */
.sidebar { width: 280px; flex-shrink: 0; background: rgba(13,17,23,0.6); border-right: 1px solid var(--border-light); padding: 32px 18px; position: sticky; top: 44px; height: calc(100vh - 44px); overflow-y: auto; }
.sidebar-brand { font-size: 1.05rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; margin-bottom: 4px; }
.sidebar-sub { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 24px; font-weight: 500; }
.sidebar-section { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); margin: 22px 0 8px; }
.sidebar a { display: block; font-size: 0.78rem; color: var(--text-muted); text-decoration: none; padding: 4px 10px; border-radius: var(--radius-sm); margin: 1px 0; line-height: 1.4; transition: background .12s, color .12s, box-shadow .12s; }
.sidebar a:hover { background: var(--surface-alt); color: var(--text); }
.sidebar a.sub { padding-left: 22px; font-size: 0.72rem; color: var(--text-dim); }
.sidebar a.sub:hover { color: var(--text-muted); }
.sidebar a.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.sidebar .req-count { font-size: 0.6rem; color: var(--text-dim); font-weight: 600; float: right; margin-top: 2px; }

/* Main content */
.main { flex: 1; max-width: 820px; padding: 52px 56px 110px; }

/* Section system */
.section { margin-bottom: 56px; padding-top: 26px; border-top: 1px solid var(--border-light); scroll-margin-top: 56px; }
.section:first-child { border-top: none; padding-top: 8px; }
.section-id { font-size: 0.56rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.section-title { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 10px; line-height: 1.25; letter-spacing: -0.01em; }
.section-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; max-width: 720px; line-height: 1.72; }

/* Subsection */
.subsection { margin-top: 36px; margin-bottom: 24px; padding-top: 18px; border-top: 1px solid var(--border-light); }
.subsection-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.subsection-desc { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.7; }

/* Strategy / callout block */
.strategy { background: var(--surface); border: 1px solid var(--border-light); border-left: 3px solid var(--accent); padding: 18px 22px; margin-bottom: 24px; border-radius: 0 var(--radius) var(--radius) 0; }
.strategy h3 { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.strategy p { font-size: 0.9rem; color: var(--text); line-height: 1.74; margin-bottom: 8px; }
.strategy p:last-child { margin-bottom: 0; }
.key-insight { background: var(--accent-dim); border-left: 3px solid var(--accent); padding: 12px 16px; margin: 14px 0; font-size: 0.84rem; line-height: 1.65; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--text-muted); }
.key-insight strong { color: var(--text); }

/* Requirement card */
.req { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.req-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-light); }
.req-id { font-size: 0.65rem; font-weight: 800; letter-spacing: 0.06em; color: var(--accent); min-width: 48px; font-family: "SF Mono", "Fira Code", monospace; }
.req-title { font-size: 0.88rem; font-weight: 600; color: var(--text); flex: 1; }
.req-pri { font-size: 0.55rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; }
.req-pri.must { background: var(--red-dim); color: var(--red); }
.req-pri.should { background: var(--amber-dim); color: var(--amber); }
.req-pri.could { background: var(--blue-dim); color: var(--blue); }
.req-body { padding: 12px 16px; font-size: 0.82rem; color: var(--text-muted); line-height: 1.65; }
.req-body strong { color: var(--text); }
.req-meta { display: flex; gap: 16px; padding: 8px 16px; background: rgba(0,0,0,0.18); font-size: 0.65rem; color: var(--text-dim); border-top: 1px solid var(--border-light); flex-wrap: wrap; }
.req-meta span { display: flex; align-items: center; gap: 4px; }
.req-meta .label { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

/* Tables */
.compare-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin: 14px 0; border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden; }
.compare-table th { text-align: left; padding: 9px 12px; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); background: var(--surface-alt); border-bottom: 1px solid var(--border); }
.compare-table td { padding: 9px 12px; border-bottom: 1px solid var(--border-light); vertical-align: top; color: var(--text-muted); }
.compare-table tr:nth-child(even) td { background: var(--surface); }
.compare-table tr:last-child td { border-bottom: none; }
.compare-table td:first-child { font-weight: 600; color: var(--text); }

/* Metric callout */
.metric-row { display: flex; gap: 16px; flex-wrap: wrap; padding: 16px 0; }
.metric { display: flex; flex-direction: column; align-items: center; padding: 14px 22px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border-light); }
.metric-value { font-size: 1.7rem; font-weight: 800; color: var(--text); line-height: 1; }
.metric-label { font-size: 0.58rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-top: 5px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 18px; transition: transform .12s, border-color .12s, box-shadow .12s; }
.card:hover { transform: translateY(-1px); border-color: var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
.card h4 { font-size: 0.84rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.card p, .card div { font-size: 0.8rem; color: var(--text-muted); line-height: 1.65; }
.footnote { font-size: 0.64rem; color: var(--text-dim); margin-top: 14px; border-top: 1px solid var(--border-light); padding-top: 8px; font-style: italic; }

/* Code blocks */
.code-block { background: var(--code-bg); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 14px 18px; font-family: "SF Mono","Fira Code",monospace; font-size: 0.72rem; line-height: 1.7; overflow-x: auto; white-space: pre; color: #c4cad6; margin: 14px 0; }

/* Diagrams & process flows */
.diagram { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.diagram-label { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border-light); }
.n { display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 0.72rem; font-weight: 600; text-align: center; background: var(--surface-alt); color: var(--text-muted); white-space: nowrap; }
.n small { display: block; font-size: 0.58rem; font-weight: 400; color: var(--text-dim); margin-top: 1px; }
.n-auto { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.n-gate { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); font-weight: 800; }
.n-guard { border-color: var(--red); color: var(--red); background: var(--red-dim); }
.n-primary { border-color: var(--accent); background: var(--accent); color: #0B0E13; }
.n-blue { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); } .n-purple { border-color: var(--purple); color: var(--purple); background: var(--purple-dim); } .n-teal { border-color: var(--teal); color: var(--teal); background: var(--teal-dim); }
.arr { color: var(--text-dim); font-size: 0.9rem; padding: 0 3px; } .arr-loop { color: var(--amber); font-weight: 800; }
.hflow { display: flex; align-items: center; flex-wrap: wrap; gap: 0; justify-content: center; }
.vflow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.vline { width: 1.5px; height: 16px; background: var(--border); }
.branch { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
.swimlane { border:1px solid var(--border-light); border-radius:var(--radius); overflow:hidden; margin-bottom:16px; }
.swimlane .lane { display:grid; grid-template-columns:130px 1fr; border-bottom:1px solid var(--border-light); }
.swimlane .lane:last-child { border-bottom:none; }
.swimlane .lane-label { background:var(--surface-alt); padding:10px 12px; font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); border-right:1px solid var(--border-light); display:flex; align-items:center; }
.swimlane .lane-body { padding:10px 12px; display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:0.78rem; color:var(--text-muted); }
.step-table { width:100%; border-collapse:collapse; font-size:0.76rem; margin:12px 0; }
.step-table th { text-align:left; padding:8px 10px; font-size:0.58rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--accent); background:var(--surface-alt); }
.step-table td { padding:8px 10px; border-bottom:1px solid var(--border-light); vertical-align:top; color:var(--text-muted); }
.step-table td:first-child { font-weight:700; color:var(--text); font-family:"SF Mono",monospace; white-space:nowrap; }

code { background: var(--surface-alt); color: #cbd3e1; padding: 1px 5px; border-radius: 4px; font-family: "SF Mono","Fira Code",monospace; font-size: 0.85em; }

@media (max-width: 900px) {
  body { flex-direction: column; }
  .spec-layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border-light); padding: 16px; }
  .main { padding: 28px 20px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* Top cross-page nav */
.rapid-nav { display: flex; align-items: center; gap: 0; background: rgba(8,11,16,0.85); backdrop-filter: saturate(140%) blur(8px); padding: 0 20px; flex-shrink: 0; overflow-x: auto; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
.rapid-nav-brand { display: flex; flex-direction: column; font-size: 12px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; padding: 8px 16px 8px 0; margin-right: 8px; border-right: 1px solid var(--border); line-height: 1.2; }
.rapid-nav-brand::before { content: "✦"; color: var(--accent); margin-right: 7px; font-size: 13px; }
.rapid-nav-brand .rapid-nav-sub { font-size: 7px; font-weight: 500; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; padding-left: 20px; }
.rapid-nav a { font-size: 9.5px; font-weight: 600; color: var(--text-dim); text-decoration: none; padding: 12px 12px; letter-spacing: 0.3px; white-space: nowrap; transition: color 0.12s; border-bottom: 2px solid transparent; }
.rapid-nav a:hover { color: var(--text); }
.rapid-nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
</style>
</head>
<body>
<nav class="rapid-nav">
  <span class="rapid-nav-brand">RAPID <span style="font-weight:400;opacity:0.5;font-size:10px;">/ AI Build Workflow</span><span class="rapid-nav-sub">Rapid Autonomous Pipeline for Iterative Development</span></span>
  {{NAV}}
</nav>
<div class="spec-layout">
<nav class="sidebar">
  <div class="sidebar-brand">RAPID</div>
  <div class="sidebar-sub">{{TITLE}}</div>
  {{SIDEBAR}}
</nav>
<div class="main">
  {{MAIN}}
</div>
</div>
<!-- v2 keeps the v1 sibling-script contract: env-links.js (harness tag + Product/Source
     links + Regenerate) and sidebar.js (left-menu Atlas map). Both must travel with the page. -->
<script src="env-links.js" defer></script>
<script src="sidebar.js" defer></script>
</body>
</html>
